<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a0f08" />
<title>Indian Spices — Learning Dashboard</title>
<style>
  :root {
    --bg: #1a0f08;
    --bg-2: #2a1810;
    --panel: #3a2418;
    --panel-2: #4a2e1c;
    --accent: #e8a33d;
    --accent-2: #d96b3a;
    --hot: #c0392b;
    --text: #f5e6d3;
    --muted: #b8a088;
    --border: #5a3825;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.25);
  }
  h1 {
    margin: 0 0 6px 0;
    font-size: 28px;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  input[type="search"] {
    flex: 1 1 220px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  .filter-btn, .mode-btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  .filter-btn:hover, .mode-btn:hover { background: var(--panel-2); }
  .filter-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .mode-btn.active { background: var(--accent-2); color: var(--text); border-color: var(--accent-2); }

  main {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 0;
    min-height: calc(100vh - 130px);
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  .grid-panel { padding: 24px 32px; overflow-y: auto; max-height: calc(100vh - 130px); }
  .detail-panel {
    padding: 24px 32px;
    background: rgba(0,0,0,0.2);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    max-height: calc(100vh - 130px);
  }
  @media (max-width: 900px) {
    .grid-panel, .detail-panel { max-height: none; }
    .detail-panel { border-left: none; border-top: 1px solid var(--border); }
  }

  .spice-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .spice-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.18s;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .spice-card:hover {
    background: var(--panel-2);
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .spice-card.selected {
    background: var(--panel-2);
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(232,163,61,0.3);
  }
  .spice-emoji { font-size: 36px; line-height: 1; margin-bottom: 8px; }
  .spice-name { font-weight: 600; font-size: 14px; color: var(--text); }
  .spice-hindi { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .heat-dots {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 9px;
    color: var(--hot);
    letter-spacing: 1px;
  }

  .detail-empty {
    color: var(--muted);
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }
  .detail-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .detail-emoji { font-size: 64px; }
  .detail-title h2 { margin: 0; color: var(--accent); font-size: 26px; }
  .detail-title .hindi { color: var(--muted); font-size: 16px; margin-top: 2px; font-style: italic; }
  .detail-title .botanical { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .detail-section { margin-bottom: 18px; }
  .detail-section h3 {
    margin: 0 0 6px 0;
    color: var(--accent-2);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .detail-section p { margin: 0; font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
  }
  .heat-meter {
    display: inline-flex;
    gap: 3px;
    align-items: center;
  }
  .heat-meter span {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .heat-meter span.on { background: var(--hot); border-color: var(--hot); }

  /* Quiz mode */
  .quiz-container { display: none; padding: 40px 32px; max-width: 600px; margin: 0 auto; }
  .quiz-container.active { display: block; }
  .quiz-question {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    margin-bottom: 20px;
  }
  .quiz-emoji { font-size: 80px; margin-bottom: 12px; }
  .quiz-prompt { font-size: 18px; margin-bottom: 4px; }
  .quiz-hint { color: var(--muted); font-size: 13px; }
  .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quiz-option {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .quiz-option:hover:not(:disabled) { background: var(--panel-2); border-color: var(--accent); }
  .quiz-option.correct { background: #2d5a2d; border-color: #4a8a4a; }
  .quiz-option.wrong { background: #5a2d2d; border-color: #8a4a4a; }
  .quiz-option:disabled { cursor: default; }
  .quiz-stats {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .quiz-score { color: var(--accent); font-weight: 600; }
  .next-btn {
    margin-top: 16px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    display: none;
  }
  .next-btn.show { display: inline-block; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--panel-2); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border); }
</style>
</head>
<body>

<header>
  <h1>Indian Spices — मसाले</h1>
  <div class="subtitle">Click any spice to learn its flavor, uses, and how to cook with it.</div>
  <div class="controls">
    <input type="search" id="search" placeholder="Search by name (English or Hindi)…" />
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="seed">Seeds</button>
    <button class="filter-btn" data-filter="powder">Powders</button>
    <button class="filter-btn" data-filter="whole">Whole</button>
    <button class="filter-btn" data-filter="leaf">Leaves</button>
    <button class="filter-btn" data-filter="blend">Blends</button>
    <span style="flex:1"></span>
    <button class="mode-btn active" id="learn-mode">📖 Learn</button>
    <button class="mode-btn" id="quiz-mode">🎯 Quiz</button>
  </div>
</header>

<main id="learn-view">
  <section class="grid-panel">
    <div class="spice-grid" id="spice-grid"></div>
  </section>
  <aside class="detail-panel" id="detail-panel">
    <div class="detail-empty">Pick a spice from the grid to see flavor profile, uses, and cooking tips.</div>
  </aside>
</main>

<div class="quiz-container" id="quiz-view">
  <div class="quiz-stats">
    <div>Question <span id="quiz-num">1</span></div>
    <div class="quiz-score">Score: <span id="quiz-score">0</span></div>
  </div>
  <div class="quiz-question">
    <div class="quiz-emoji" id="quiz-emoji"></div>
    <div class="quiz-prompt" id="quiz-prompt"></div>
    <div class="quiz-hint" id="quiz-hint"></div>
  </div>
  <div class="quiz-options" id="quiz-options"></div>
  <div style="text-align:center;">
    <button class="next-btn" id="next-btn">Next →</button>
  </div>
</div>

const CATEGORY_LABELS = {
  seed: 'Seed', powder: 'Powder', whole: 'Whole spice', leaf: 'Leaf', blend: 'Blend'
};

const grid = document.getElementById('spice-grid');
const detail = document.getElementById('detail-panel');
const search = document.getElementById('search');
let activeFilter = 'all';
let selectedId = null;

function renderGrid() {
  const q = search.value.trim().toLowerCase();
  grid.innerHTML = '';
  const filtered = SPICES.filter(s => {
    if (activeFilter !== 'all' && s.category !== activeFilter) return false;
    if (!q) return true;
    return (s.name + ' ' + s.hindi + ' ' + s.botanical).toLowerCase().includes(q);
  });
  if (!filtered.length) {
    grid.innerHTML = '<div style="color:var(--muted); padding: 20px;">No spices match.</div>';
    return;
  }
  filtered.forEach(s => {
    const card = document.createElement('div');
    card.className = 'spice-card' + (s.id === selectedId ? ' selected' : '');
    card.innerHTML = `
      ${s.heat > 0 ? `<div class="heat-dots">${'●'.repeat(s.heat)}</div>` : ''}
      <div class="spice-emoji">${s.emoji}</div>
      <div class="spice-name">${s.name}</div>
      <div class="spice-hindi">${s.hindi}</div>
    `;
    card.addEventListener('click', () => selectSpice(s.id));
    grid.appendChild(card);
  });
}

function selectSpice(id) {
  selectedId = id;
  const s = SPICES.find(x => x.id === id);
  document.querySelectorAll('.spice-card').forEach(c => c.classList.remove('selected'));
  const cards = grid.querySelectorAll('.spice-card');
  cards.forEach(c => {
    if (c.querySelector('.spice-name').textContent === s.name) c.classList.add('selected');
  });
  const heatHTML = `<span class="heat-meter">${[0,1,2,3,4].map(i => `<span class="${i < s.heat ? 'on' : ''}"></span>`).join('')}</span>`;
  detail.innerHTML = `
    <div class="detail-header">
      <div class="detail-emoji">${s.emoji}</div>
      <div class="detail-title">
        <h2>${s.name}</h2>
        <div class="hindi">${s.hindi}</div>
        <div class="botanical">${s.botanical} · ${CATEGORY_LABELS[s.category]}</div>
      </div>
    </div>
    <div class="detail-section">
      <h3>Flavor</h3>
      <p>${s.flavor}</p>
    </div>
    <div class="detail-section">
      <h3>How it's used</h3>
      <p>${s.uses}</p>
    </div>
    <div class="detail-section">
      <h3>Cooking tip</h3>
      <p>${s.tip}</p>
    </div>
    <div class="detail-section">
      <h3>Region</h3>
      <p>${s.region}</p>
    </div>
    <div class="detail-section">
      <h3>Heat level</h3>
      <p>${heatHTML} ${s.heat === 0 ? '<span style="color:var(--muted); margin-left:8px;">aromatic, not spicy</span>' : ''}</p>
    </div>
    <div class="detail-section">
      <h3>Pairs well with</h3>
      <div class="tags">${s.pairs.map(p => `<span class="tag">${p}</span>`).join('')}</div>
    </div>
  `;
}

search.addEventListener('input', renderGrid);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderGrid();
  });
});

// Mode toggle
const learnView = document.getElementById('learn-view');
const quizView = document.getElementById('quiz-view');
const learnBtn = document.getElementById('learn-mode');
const quizBtn = document.getElementById('quiz-mode');

learnBtn.addEventListener('click', () => {
  learnBtn.classList.add('active'); quizBtn.classList.remove('active');
  learnView.style.display = 'grid';
  quizView.classList.remove('active');
});
quizBtn.addEventListener('click', () => {
  quizBtn.classList.add('active'); learnBtn.classList.remove('active');
  learnView.style.display = 'none';
  quizView.classList.add('active');
  startQuiz();
});

// Quiz
let quizScore = 0;
let quizNum = 0;
let currentQuiz = null;

function shuffle(a) { return a.slice().sort(() => Math.random() - 0.5); }

function startQuiz() {
  quizScore = 0; quizNum = 0;
  document.getElementById('quiz-score').textContent = quizScore;
  nextQuestion();
}

function nextQuestion() {
  quizNum++;
  document.getElementById('quiz-num').textContent = quizNum;
  document.getElementById('next-btn').classList.remove('show');
  const correct = SPICES[Math.floor(Math.random() * SPICES.length)];
  const wrong = shuffle(SPICES.filter(s => s.id !== correct.id)).slice(0, 3);
  const options = shuffle([correct, ...wrong]);
  currentQuiz = correct.id;

  const questionTypes = ['emoji-to-name', 'hindi-to-name', 'flavor-to-name'];
  const qt = questionTypes[Math.floor(Math.random() * questionTypes.length)];

  const emojiEl = document.getElementById('quiz-emoji');
  const promptEl = document.getElementById('quiz-prompt');
  const hintEl = document.getElementById('quiz-hint');

  if (qt === 'emoji-to-name') {
    emojiEl.textContent = correct.emoji;
    promptEl.textContent = 'Which spice is this?';
    hintEl.textContent = `Hint: ${CATEGORY_LABELS[correct.category]}`;
  } else if (qt === 'hindi-to-name') {
    emojiEl.textContent = '🇮🇳';
    promptEl.textContent = correct.hindi;
    hintEl.textContent = 'What is the English name?';
  } else {
    emojiEl.textContent = '👅';
    promptEl.textContent = correct.flavor;
    hintEl.textContent = 'Which spice tastes like this?';
  }

  const optsEl = document.getElementById('quiz-options');
  optsEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt.name;
    btn.addEventListener('click', () => answerQuiz(opt.id, btn));
    optsEl.appendChild(btn);
  });
}

function answerQuiz(id, btn) {
  const buttons = document.querySelectorAll('.quiz-option');
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === SPICES.find(s => s.id === currentQuiz).name) b.classList.add('correct');
  });
  if (id === currentQuiz) {
    quizScore++;
    document.getElementById('quiz-score').textContent = quizScore;
  } else {
    btn.classList.add('wrong');
  }
  document.getElementById('next-btn').classList.add('show');
}

document.getElementById('next-btn').addEventListener('click', nextQuestion);

// Initial render
renderGrid();
selectSpice('turmeric');
</script>
